name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Static security scan of my own code (Bandit)
        # The deliberately vulnerable sample app under eval/vulnerable_app is NOT scanned here.
        run: bandit -r src eval/run_eval.py -ll
      - name: Tests (offline: mock LLM only, no API key, no network)
        run: pytest -q
